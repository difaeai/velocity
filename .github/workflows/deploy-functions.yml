name: Deploy Cloud Functions

on:
  # Manual trigger (Actions tab → this workflow → "Run workflow").
  #
  # Without this, a deploy could ONLY be produced by pushing to one of the paths
  # below — so when a push landed while Actions was unavailable (an exhausted
  # minute quota, an outage), the commit stayed permanently undeployed with no way
  # to re-run it short of a dummy commit. That is precisely how
  # exchangePhoneSession ended up merged but missing from production while the app
  # that depends on it was already built.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # A change to the deploy pipeline itself deploys, so the pipeline is
      # exercised by the commit that changes it rather than by whatever
      # unrelated backend push happens to come next.
      - '.github/workflows/deploy-functions.yml'
      - 'backend/functions/**'
      - 'backend/voice-bridge/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'docs/**'

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  # This workflow and CI both start on the same push, so without this a red CI
  # still shipped. Wait for CI's run on this exact commit and stop unless it
  # passed. A manual dispatch skips the wait: it exists for commits CI never ran
  # on (Actions was down), and a person chose to run it.
  wait-for-ci:
    name: Wait for CI on this commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for the CI run to finish green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --json status,conclusion,url --jq '.[0] // empty')
            status=$(echo "$run" | jq -r '.status // "missing"')
            conclusion=$(echo "$run" | jq -r '.conclusion // ""')
            echo "CI: $status $conclusion"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] && exit 0
              echo "::error::CI did not pass on $GITHUB_SHA ($(echo "$run" | jq -r .url)); not deploying."
              exit 1
            fi
            sleep 20
          done
          echo "::error::CI did not finish within 40 minutes; not deploying."
          exit 1

  deploy:
    name: Deploy to Firebase (asia-south1)
    needs: wait-for-ci
    # `always()` so a skipped wait (manual dispatch) still deploys; a failed one never does.
    if: always() && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install function dependencies
        working-directory: backend/functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # The voice bridge (backend/voice-bridge): AI calling agents need a
      # WebSocket server, which a Cloud Function cannot be, so it is its own
      # Cloud Run service, built from source. It holds no keys — the functions
      # hand it a one-use Gemini Live token per call — and its URL becomes
      # VOICE_BRIDGE_URL below. Redeployed only when its folder changed (the
      # tree hash rides on the service as a label). Allowed to fail: without a
      # bridge AI calls stay off, and that must never block the functions.
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy the voice bridge (Cloud Run)
        id: bridge
        continue-on-error: true
        run: |
          tree=$(git rev-parse HEAD:backend/voice-bridge)
          have=$(gcloud run services describe voice-bridge --project velocity-fe379 --region asia-south1 \
            --format='value(metadata.labels.bridge-tree)' 2>/dev/null || true)
          if [ "$tree" != "$have" ]; then
            gcloud run deploy voice-bridge --project velocity-fe379 --region asia-south1 \
              --source backend/voice-bridge --allow-unauthenticated \
              --timeout 900 --concurrency 20 --min-instances 0 --max-instances 5 --memory 512Mi \
              --set-env-vars "FUNCTIONS_URL=https://asia-south1-velocity-fe379.cloudfunctions.net" \
              --labels "bridge-tree=$tree" --quiet
          else
            echo "· voice bridge unchanged"
          fi
          url=$(gcloud run services describe voice-bridge --project velocity-fe379 --region asia-south1 --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "· voice bridge at $url"

      # Backend runtime config, assembled into the .env file the Firebase CLI
      # deploys as function environment variables.
      #
      # PAYMENTS_GATEWAY_ENV is a BLOCK of KEY=value lines (gateways + Anthropic).
      # GOOGLE_MAPS_SERVER_KEY is its own secret, holding just the key, so it can
      # be rotated on its own without anyone having to reconstruct — and risk
      # clobbering — a block of credentials they cannot read back out of GitHub.
      #
      # Both are optional and every consumer degrades rather than breaks: no
      # gateway keys → the wallet runs on the mock provider; no Maps key →
      # en-route pickups fall back to the (validated) client polyline.
      - name: Inject backend secrets
        working-directory: backend/functions
        env:
          PAYMENTS_GATEWAY_ENV: ${{ secrets.PAYMENTS_GATEWAY_ENV }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_KEY_RESEARCH: ${{ secrets.GEMINI_KEY_RESEARCH }}
          GEMINI_LIVE_KEY: ${{ secrets.GEMINI_LIVE_KEY }}
          CLOUDFLARE_TURN_KEY_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
          CLOUDFLARE_TURN_API_TOKEN: ${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}
          FREE_MODEL_ENV: ${{ secrets.FREE_MODEL_ENV }}
          WHATSAPP_ENV: ${{ secrets.WHATSAPP_ENV }}
          WHATSAPP_OTP_ENV: ${{ secrets.WHATSAPP_OTP_ENV }}
          COST_SOURCES_ENV: ${{ secrets.COST_SOURCES_ENV }}
          VOICE_BRIDGE_URL: ${{ steps.bridge.outputs.url }}
        run: |
          : > .env.velocity-fe379
          # Where AI calling agents stream a call's audio (the step above).
          if [ -n "$VOICE_BRIDGE_URL" ]; then
            printf 'VOICE_BRIDGE_URL=%s\n' "$VOICE_BRIDGE_URL" >> .env.velocity-fe379
            echo "· agents: AI calls READY (voice bridge at $VOICE_BRIDGE_URL)"
          else
            echo "· agents: no voice bridge — AI calls stay off; scripts still work"
          fi
          if [ -n "$PAYMENTS_GATEWAY_ENV" ]; then
            printf '%s\n' "$PAYMENTS_GATEWAY_ENV" >> .env.velocity-fe379
          else
            echo "· payments: no gateway credentials — wallet stays in mock mode"
          fi
          if [ -n "$GOOGLE_MAPS_SERVER_KEY" ]; then
            # Appended separately, so it wins even if the block also carries one.
            printf 'GOOGLE_MAPS_SERVER_KEY=%s\n' "$GOOGLE_MAPS_SERVER_KEY" >> .env.velocity-fe379
            echo "· routes: server-side routing ENABLED"
          else
            echo "· routes: no key — en-route falls back to the client polyline"
          fi
          # The social desk's token vault. This is the one key that fails closed
          # rather than degrading: without it, accounts cannot be connected and
          # nothing is published — because the alternative is storing page
          # tokens in the clear.
          if [ -n "$SOCIAL_TOKEN_KEY" ]; then
            printf 'SOCIAL_TOKEN_KEY=%s\n' "$SOCIAL_TOKEN_KEY" >> .env.velocity-fe379
            echo "· social: token vault READY"
          else
            echo "· social: no SOCIAL_TOKEN_KEY — accounts cannot be connected"
          fi
          # Stock footage under the reels (free key), for the beats our own
          # clip library does not cover.
          if [ -n "$PIXABAY_API_KEY" ]; then
            printf 'PIXABAY_API_KEY=%s\n' "$PIXABAY_API_KEY" >> .env.velocity-fe379
            echo "· social: reels fill gaps with Pixabay footage"
          else
            echo "· social: no PIXABAY_API_KEY — reels use our own clips or type only"
          fi
          # The key the REMAINING AI features read. There was no path for it here
          # until 2026-10-16, which meant it had never reached production — and
          # because each caller degrades politely rather than erroring, nothing
          # ever said so. Hence a readiness line either way.
          #
          # Driver verification is NO LONGER one of those callers. It runs its
          # own engine inside the function now — Tesseract for the text and a
          # 128-dimension face descriptor for the photographs, both local,
          # neither needing a key (backend/functions/src/lib/localVision.ts).
          # So an absent key no longer silently sends every driver applicant to
          # a human, which is the exact failure this line was written to expose.
          # What is left depending on it:
          #   · the social desk refuses to generate (the one loud failure);
          #   · commission and cancellation-fee proofs skip verification and
          #     wait for an admin;
          #   · support tickets all go to the human desk.
          # NOT the same key as ANTHROPIC_ADMIN_KEY in COST_SOURCES_ENV: that
          # one only reads the org's cost report.
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> .env.velocity-fe379
            echo "· ai: proof checks, support and social READY"
          else
            echo "· ai: no ANTHROPIC_API_KEY — payment proofs wait for an admin."
            echo "      Driver verification is unaffected: its engine is local."
          fi
          # Gemini's free tier — one bare key, no block, because there is only
          # ever one value: AI Studio gives you a key and that is the whole
          # configuration. The model is chosen in code (and overridable from
          # the console's model box), not here.
          #
          # This is the engine that put the morning market read back. Claude
          # can search and is paid for; the OpenAI-compatible free model
          # cannot search at all and says so. Google's free tier can, at no
          # charge, up to 500 grounded reads a day against a desk that needs
          # one — so with this key the standup is working in front of real
          # pages again instead of an honest refusal.
          #
          # It is also a whole engine, not just research: when it is the one
          # that answers it writes, plans, briefs and replies too. Order is
          # ANTHROPIC_API_KEY → GEMINI_KEY_RESEARCH → FREE_MODEL_KEY → local.
          #
          # One thing to be plain about: on the FREE tier Google may use what
          # is sent to improve their products. For the social desk that is brand
          # material, a competitor list and public figures. Support replies, and
          # the phone helpline below when it has no key of its own, DO send the
          # caller's own account facts.
          if [ -n "$GEMINI_KEY_RESEARCH" ]; then
            printf 'GEMINI_KEY_RESEARCH=%s\n' "$GEMINI_KEY_RESEARCH" >> .env.velocity-fe379
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              echo "· ai: Gemini configured but idle — Anthropic takes precedence"
            else
              echo "· ai: social and support run on GEMINI's free tier — market read WORKS"
            fi
          else
            echo "· ai: no GEMINI_KEY_RESEARCH — no free market read"
          fi
          # The phone helpline's AI voice (support/helpline.ts). Its own key so
          # call audio can run on a billed project, which Google does not train
          # on and which takes more calls at once; without it, the free key.
          if [ -n "$GEMINI_LIVE_KEY" ]; then
            printf 'GEMINI_LIVE_KEY=%s\n' "$GEMINI_LIVE_KEY" >> .env.velocity-fe379
            echo "· helpline: own Gemini key READY"
          elif [ -n "$GEMINI_KEY_RESEARCH" ]; then
            echo "· helpline: on the FREE Gemini tier — Google may use call audio, few calls at once"
          else
            echo "· helpline: no Gemini key — callers are sent to written support"
          fi
          # In-app rider↔driver calls relay through Cloudflare TURN when two
          # phones cannot reach each other directly. Free to 1,000 GB a month.
          if [ -n "$CLOUDFLARE_TURN_KEY_ID" ] && [ -n "$CLOUDFLARE_TURN_API_TOKEN" ]; then
            printf 'CLOUDFLARE_TURN_KEY_ID=%s\n' "$CLOUDFLARE_TURN_KEY_ID" >> .env.velocity-fe379
            printf 'CLOUDFLARE_TURN_API_TOKEN=%s\n' "$CLOUDFLARE_TURN_API_TOKEN" >> .env.velocity-fe379
            echo "· calls: TURN relay READY"
          else
            echo "· calls: STUN only — some calls between two mobile networks will not connect"
          fi
          # The free engine: any OpenAI-compatible endpoint, Groq by default.
          # Its own block rather than three secrets, so the provider can be
          # changed in one place without anyone reconstructing a set of values
          # they cannot read back out of GitHub — the same reason the payments
          # and WhatsApp blocks are shaped this way. Contents:
          #
          #   FREE_MODEL_KEY=...          the key; its presence turns this on
          #   FREE_MODEL_URL=...          optional, default Groq's base URL
          #   FREE_MODEL_ID=...           optional, default a production Llama
          #
          # It is the fallback for the two callers that can use either engine
          # — the social desk and support replies — and ANTHROPIC_API_KEY wins
          # whenever both are present. Payment-proof vision does NOT read this:
          # it is a vision call, and pointing it at a second vendor is a change
          # to how money is verified, not a key swap.
          #
          # Unlike the blocks above, this one is cleaned before it is written.
          # Firebase's dotenv parser rejects the whole file over one bad line
          # and reports it as `Invalid dotenv file, error on lines: ***` — the
          # content masked, because it came out of a secret. That is an
          # unreadable failure for the one block most likely to be pasted by
          # hand from a chat window, carrying a CR, a blank line, a stray quote
          # or a fence. So: strip CRs, drop everything that is not NAME=value,
          # and print the names that survived. Names are not secrets; values
          # are, and GitHub masks those anyway.
          #
          # The older blocks are deliberately left alone. They work, they are
          # rarely retyped, and this is the deploy path — not the place to
          # change three things that are not broken.
          if [ -n "$FREE_MODEL_ENV" ]; then
            printf '%s\n' "$FREE_MODEL_ENV" \
              | tr -d '\r' \
              | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' > .free-model.env || true
            # A bare key with no NAME= in front of it is not a mistake worth a
            # failed deploy and a second trip to the settings page: pasting the
            # key is the obvious thing to do when the secret is called
            # FREE_MODEL_ENV. One line, no '=', no spaces — that is a key, so
            # name it and move on. The URL and model id keep their defaults.
            if [ ! -s .free-model.env ]; then
              bare=$(printf '%s' "$FREE_MODEL_ENV" | tr -d '\r\n')
              case "$bare" in
                *=*|*\ *|'') ;;
                *)
                  if [ ${#bare} -ge 8 ]; then
                    printf 'FREE_MODEL_KEY=%s\n' "$bare" > .free-model.env
                    echo "· ai: FREE_MODEL_ENV held a bare key — read as FREE_MODEL_KEY"
                  fi
                  ;;
              esac
            fi
            if [ -s .free-model.env ]; then
              cat .free-model.env >> .env.velocity-fe379
              echo "· ai: free model block parsed — $(cut -d= -f1 .free-model.env | tr '\n' ' ')"
              if ! cut -d= -f1 .free-model.env | grep -qx 'FREE_MODEL_KEY'; then
                echo "· ai: WARNING — no FREE_MODEL_KEY line in that block, so the"
                echo "      free engine stays OFF. Check the secret's first line."
              elif [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$GEMINI_KEY_RESEARCH" ]; then
                echo "· ai: free model configured but idle — a higher engine takes precedence"
              else
                echo "· ai: social and support run on the FREE model (no market read)"
              fi
            else
              echo "· ai: FREE_MODEL_ENV is set but holds no NAME=value line, so"
              echo "      nothing was written. Expected three lines like"
              echo "      FREE_MODEL_KEY=... — no quotes, no code fence, no blank first line."
            fi
            rm -f .free-model.env
          elif [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$GEMINI_KEY_RESEARCH" ]; then
            echo "· ai: no model key at all — the social desk writes locally and"
            echo "      support tickets all go to the human desk."
          fi
          # WhatsApp Cloud API — its own block (WHATSAPP_TOKEN, _PHONE_NUMBER_ID,
          # _TEMPLATE_NAME, _TEMPLATE_LANG, _VERIFY_TOKEN, _APP_SECRET), kept
          # apart from the payments block so the token can be rotated without
          # anyone having to reconstruct a set of credentials they cannot read
          # back out of GitHub. Absent → offline-driver alerts stay dark; the
          # rides themselves are unaffected.
          if [ -n "$WHATSAPP_ENV" ]; then
            printf '%s\n' "$WHATSAPP_ENV" >> .env.velocity-fe379
            echo "· whatsapp: offline-driver alerts CONFIGURED"
          else
            echo "· whatsapp: no WHATSAPP_ENV — offline-driver alerts stay off"
          fi
          # Sign-in codes go out on the SAME number and token but a DIFFERENT
          # template, because Meta will not let one template serve two
          # categories. Its own secret rather than three more lines inside
          # WHATSAPP_ENV, for the reason every block here is split: GitHub
          # overwrites a secret wholesale and will not read one back, so
          # "just add a line" means retyping a permanent access token nobody
          # can see. Appended after the block, so it also wins over a stale
          # duplicate left inside it.
          #
          # Absent → every login falls back to Firebase SMS, which works and
          # costs several times as much per code. Worth printing: the failure
          # mode is a silently larger bill, not anything breaking.
          if [ -n "$WHATSAPP_OTP_ENV" ]; then
            printf '%s\n' "$WHATSAPP_OTP_ENV" >> .env.velocity-fe379
          fi
          if grep -q "^WHATSAPP_OTP_TEMPLATE_NAME=." .env.velocity-fe379; then
            echo "· whatsapp: sign-in OTP CONFIGURED"
          else
            echo "· whatsapp: no WHATSAPP_OTP_TEMPLATE_NAME — logins stay on Firebase SMS"
          fi
          # Vendor billing credentials, so the Cost of Velocity page fills itself
          # in instead of being typed from invoices: BILLING_BQ_TABLE (the
          # BigQuery billing export), ANTHROPIC_ADMIN_KEY (org cost report — a
          # DIFFERENT key from the one the social desk writes with), and
          # WHATSAPP_WABA_ID / META_AD_ACCOUNT_ID / META_COST_TOKEN. Each source
          # is independent and each is optional: absent → that vendor reads
          # "not connected" in the console and its lines stay hand-entered.
          if [ -n "$COST_SOURCES_ENV" ]; then
            printf '%s\n' "$COST_SOURCES_ENV" >> .env.velocity-fe379
            echo "· costs: vendor billing CONFIGURED"
          else
            echo "· costs: no COST_SOURCES_ENV — the cost page stays hand-entered"
          fi
          # Which cost sources will actually answer once deployed.
          #
          # Read from the ASSEMBLED env rather than from the secrets, because
          # that is the only place the answer exists: WHATSAPP_TOKEN arrives
          # inside the WHATSAPP_ENV block, so whether Meta can authenticate is
          # not knowable from any single secret. Presence only — no values are
          # ever printed here.
          have() { grep -q "^$1=." .env.velocity-fe379; }
          if have BILLING_BQ_TABLE; then echo "· costs: Google Cloud READY"; else echo "· costs: Google Cloud not configured"; fi
          if have ANTHROPIC_ADMIN_KEY; then echo "· costs: Anthropic READY"; else echo "· costs: Anthropic not configured"; fi
          meta_token=no; meta_id=no
          have META_COST_TOKEN && meta_token=yes || true
          have WHATSAPP_TOKEN && meta_token=yes || true
          have WHATSAPP_WABA_ID && meta_id=yes || true
          have META_AD_ACCOUNT_ID && meta_id=yes || true
          if [ "$meta_token" = yes ] && [ "$meta_id" = yes ]; then
            echo "· costs: Meta READY"
          elif [ "$meta_id" = yes ]; then
            echo "· costs: Meta has an account id but NO TOKEN — add META_COST_TOKEN to COST_SOURCES_ENV"
          else
            echo "· costs: Meta not configured"
          fi
          echo "Backend env assembled ($(grep -c '=' .env.velocity-fe379) vars)."

      - name: Deploy Firestore indexes
        continue-on-error: true
        run: firebase deploy --only firestore:indexes --project velocity-fe379 --non-interactive

      # Rules and hosting go first, on their own. They are three small writes,
      # they cannot exhaust a function quota, and a wedged function deploy has no
      # business holding a security-rules change hostage.
      - name: Deploy Firestore rules + Storage rules + Hosting
        run: firebase deploy --only firestore:rules,storage,hosting --project velocity-fe379 --non-interactive --force

      # Functions, with retries — and the retries are the point.
      #
      # This codebase is ~216 functions in one region sharing one source bundle,
      # so any push under backend/functions/ changes every hash and every single
      # function is rewritten. That walks straight into two asia-south1 Cloud Run
      # quotas: 'Write requests per minute per region' (the CLI writes 40 at a
      # time, the limit is 60/min), and 'total allowable CPU per project per
      # region', which the container healthcheck trips when a batch of revisions
      # all boot at once.
      #
      # Neither one arrives as an HTTP 429. They come back inside a *completed*
      # long-running operation as RESOURCE_EXHAUSTED, so the CLI's own retry —
      # which only covers 429/409/503 on the request itself — never sees them,
      # and the deploy just ends with a handful of functions broken. That is how
      # 77980c1 left socialEngagement and adminSyncSocialComments in state FAILED
      # with no Cloud Run service behind them, and adminSetCommentStatus never
      # created at all, while the step exited 2.
      #
      # Retrying converges because the CLI skips a function only when it is both
      # unchanged AND already ACTIVE: everything that landed is skipped, and the
      # stragglers — a handful, not 216 — are all that gets written, with the
      # per-minute window having had 90s to refill.
      #
      # If this needs three attempts on a regular basis, the fix is a quota
      # increase on run.googleapis.com in asia-south1, not a fourth attempt.
      - name: Deploy Cloud Functions
        run: |
          attempts=3
          for attempt in $(seq 1 $attempts); do
            echo "::group::functions deploy — attempt $attempt of $attempts"
            if firebase deploy --only functions --project velocity-fe379 --non-interactive --force; then
              echo "::endgroup::"
              echo "Functions deployed on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Deploy incomplete. Waiting 90s for the Cloud Run write quota to refill, then retrying only what is left."
              sleep 90
            fi
          done
          echo "Functions still not fully deployed after $attempts attempts — this is not a flake, go read the errors above."
          exit 1
