name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'backend/functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Firebase (asia-south1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install function dependencies
        working-directory: backend/functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # Payment gateway credentials (JazzCash / Easypaisa). Optional: when the
      # PAYMENTS_GATEWAY_ENV repository secret is unset, no .env is written and
      # the wallet keeps running on the mock provider. The secret's content is
      # KEY=value lines — see backend/functions/.env.example for the keys.
      - name: Inject payment gateway credentials
        working-directory: backend/functions
        env:
          PAYMENTS_GATEWAY_ENV: ${{ secrets.PAYMENTS_GATEWAY_ENV }}
        run: |
          if [ -n "$PAYMENTS_GATEWAY_ENV" ]; then
            printf '%s\n' "$PAYMENTS_GATEWAY_ENV" > .env.velocity-fe379
            echo "Gateway credentials injected ($(grep -c '=' .env.velocity-fe379) vars)."
          else
            echo "PAYMENTS_GATEWAY_ENV secret not set — payments stay in mock mode."
          fi

      - name: Deploy Firestore indexes
        continue-on-error: true
        run: firebase deploy --only firestore:indexes --project velocity-fe379 --non-interactive

      - name: Deploy Cloud Functions + Firestore rules + Storage rules
        run: firebase deploy --only functions,firestore:rules,storage --project velocity-fe379 --non-interactive
