name: Deploy Cloud Functions

on:
  # Manual trigger (Actions tab → this workflow → "Run workflow").
  #
  # Without this, a deploy could ONLY be produced by pushing to one of the paths
  # below — so when a push landed while Actions was unavailable (an exhausted
  # minute quota, an outage), the commit stayed permanently undeployed with no way
  # to re-run it short of a dummy commit. That is precisely how
  # exchangePhoneSession ended up merged but missing from production while the app
  # that depends on it was already built.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # A change to the deploy pipeline itself deploys, so the pipeline is
      # exercised by the commit that changes it rather than by whatever
      # unrelated backend push happens to come next.
      - '.github/workflows/deploy-functions.yml'
      - 'backend/functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'docs/**'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Firebase (asia-south1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install function dependencies
        working-directory: backend/functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # Backend runtime config, assembled into the .env file the Firebase CLI
      # deploys as function environment variables.
      #
      # PAYMENTS_GATEWAY_ENV is a BLOCK of KEY=value lines (gateways + Anthropic).
      # GOOGLE_MAPS_SERVER_KEY is its own secret, holding just the key, so it can
      # be rotated on its own without anyone having to reconstruct — and risk
      # clobbering — a block of credentials they cannot read back out of GitHub.
      #
      # Both are optional and every consumer degrades rather than breaks: no
      # gateway keys → the wallet runs on the mock provider; no Maps key →
      # en-route pickups fall back to the (validated) client polyline.
      - name: Inject backend secrets
        working-directory: backend/functions
        env:
          PAYMENTS_GATEWAY_ENV: ${{ secrets.PAYMENTS_GATEWAY_ENV }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_ENV: ${{ secrets.WHATSAPP_ENV }}
          COST_SOURCES_ENV: ${{ secrets.COST_SOURCES_ENV }}
        run: |
          : > .env.velocity-fe379
          if [ -n "$PAYMENTS_GATEWAY_ENV" ]; then
            printf '%s\n' "$PAYMENTS_GATEWAY_ENV" >> .env.velocity-fe379
          else
            echo "· payments: no gateway credentials — wallet stays in mock mode"
          fi
          if [ -n "$GOOGLE_MAPS_SERVER_KEY" ]; then
            # Appended separately, so it wins even if the block also carries one.
            printf 'GOOGLE_MAPS_SERVER_KEY=%s\n' "$GOOGLE_MAPS_SERVER_KEY" >> .env.velocity-fe379
            echo "· routes: server-side routing ENABLED"
          else
            echo "· routes: no key — en-route falls back to the client polyline"
          fi
          # The social desk's token vault. This is the one key that fails closed
          # rather than degrading: without it, accounts cannot be connected and
          # nothing is published — because the alternative is storing page
          # tokens in the clear.
          if [ -n "$SOCIAL_TOKEN_KEY" ]; then
            printf 'SOCIAL_TOKEN_KEY=%s\n' "$SOCIAL_TOKEN_KEY" >> .env.velocity-fe379
            echo "· social: token vault READY"
          else
            echo "· social: no SOCIAL_TOKEN_KEY — accounts cannot be connected"
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env.velocity-fe379
            echo "· social: the content crew is READY"
          else
            echo "· social: no GEMINI_API_KEY — the crew cannot plan, write, draw or render"
          fi
          # WhatsApp Cloud API — its own block (WHATSAPP_TOKEN, _PHONE_NUMBER_ID,
          # _TEMPLATE_NAME, _TEMPLATE_LANG, _VERIFY_TOKEN, _APP_SECRET), kept
          # apart from the payments block so the token can be rotated without
          # anyone having to reconstruct a set of credentials they cannot read
          # back out of GitHub. Absent → offline-driver alerts stay dark; the
          # rides themselves are unaffected.
          if [ -n "$WHATSAPP_ENV" ]; then
            printf '%s\n' "$WHATSAPP_ENV" >> .env.velocity-fe379
            echo "· whatsapp: offline-driver alerts CONFIGURED"
          else
            echo "· whatsapp: no WHATSAPP_ENV — offline-driver alerts stay off"
          fi
          # Vendor billing credentials, so the Cost of Velocity page fills itself
          # in instead of being typed from invoices: BILLING_BQ_TABLE (the
          # BigQuery billing export), ANTHROPIC_ADMIN_KEY (org cost report — a
          # DIFFERENT key from the one the social desk writes with), and
          # WHATSAPP_WABA_ID / META_AD_ACCOUNT_ID / META_COST_TOKEN. Each source
          # is independent and each is optional: absent → that vendor reads
          # "not connected" in the console and its lines stay hand-entered.
          if [ -n "$COST_SOURCES_ENV" ]; then
            printf '%s\n' "$COST_SOURCES_ENV" >> .env.velocity-fe379
            echo "· costs: vendor billing CONFIGURED"
          else
            echo "· costs: no COST_SOURCES_ENV — the cost page stays hand-entered"
          fi
          # Which cost sources will actually answer once deployed.
          #
          # Read from the ASSEMBLED env rather than from the secrets, because
          # that is the only place the answer exists: WHATSAPP_TOKEN arrives
          # inside the WHATSAPP_ENV block, so whether Meta can authenticate is
          # not knowable from any single secret. Presence only — no values are
          # ever printed here.
          have() { grep -q "^$1=." .env.velocity-fe379; }
          if have BILLING_BQ_TABLE; then echo "· costs: Google Cloud READY"; else echo "· costs: Google Cloud not configured"; fi
          if have ANTHROPIC_ADMIN_KEY; then echo "· costs: Anthropic READY"; else echo "· costs: Anthropic not configured"; fi
          meta_token=no; meta_id=no
          have META_COST_TOKEN && meta_token=yes || true
          have WHATSAPP_TOKEN && meta_token=yes || true
          have WHATSAPP_WABA_ID && meta_id=yes || true
          have META_AD_ACCOUNT_ID && meta_id=yes || true
          if [ "$meta_token" = yes ] && [ "$meta_id" = yes ]; then
            echo "· costs: Meta READY"
          elif [ "$meta_id" = yes ]; then
            echo "· costs: Meta has an account id but NO TOKEN — add META_COST_TOKEN to COST_SOURCES_ENV"
          else
            echo "· costs: Meta not configured"
          fi
          echo "Backend env assembled ($(grep -c '=' .env.velocity-fe379) vars)."

      - name: Deploy Firestore indexes
        continue-on-error: true
        run: firebase deploy --only firestore:indexes --project velocity-fe379 --non-interactive

      # Rules and hosting go first, on their own. They are three small writes,
      # they cannot exhaust a function quota, and a wedged function deploy has no
      # business holding a security-rules change hostage.
      - name: Deploy Firestore rules + Storage rules + Hosting
        run: firebase deploy --only firestore:rules,storage,hosting --project velocity-fe379 --non-interactive --force

      # Functions, with retries — and the retries are the point.
      #
      # This codebase is ~216 functions in one region sharing one source bundle,
      # so any push under backend/functions/ changes every hash and every single
      # function is rewritten. That walks straight into two asia-south1 Cloud Run
      # quotas: 'Write requests per minute per region' (the CLI writes 40 at a
      # time, the limit is 60/min), and 'total allowable CPU per project per
      # region', which the container healthcheck trips when a batch of revisions
      # all boot at once.
      #
      # Neither one arrives as an HTTP 429. They come back inside a *completed*
      # long-running operation as RESOURCE_EXHAUSTED, so the CLI's own retry —
      # which only covers 429/409/503 on the request itself — never sees them,
      # and the deploy just ends with a handful of functions broken. That is how
      # 77980c1 left socialEngagement and adminSyncSocialComments in state FAILED
      # with no Cloud Run service behind them, and adminSetCommentStatus never
      # created at all, while the step exited 2.
      #
      # Retrying converges because the CLI skips a function only when it is both
      # unchanged AND already ACTIVE: everything that landed is skipped, and the
      # stragglers — a handful, not 216 — are all that gets written, with the
      # per-minute window having had 90s to refill.
      #
      # If this needs three attempts on a regular basis, the fix is a quota
      # increase on run.googleapis.com in asia-south1, not a fourth attempt.
      - name: Deploy Cloud Functions
        run: |
          attempts=3
          for attempt in $(seq 1 $attempts); do
            echo "::group::functions deploy — attempt $attempt of $attempts"
            if firebase deploy --only functions --project velocity-fe379 --non-interactive --force; then
              echo "::endgroup::"
              echo "Functions deployed on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Deploy incomplete. Waiting 90s for the Cloud Run write quota to refill, then retrying only what is left."
              sleep 90
            fi
          done
          echo "Functions still not fully deployed after $attempts attempts — this is not a flake, go read the errors above."
          exit 1
