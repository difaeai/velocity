name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'backend/functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Firebase (asia-south1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install function dependencies
        working-directory: backend/functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # Backend secrets, as KEY=value lines in the PAYMENTS_GATEWAY_ENV repository
      # secret. Despite the name it now carries everything the functions need at
      # runtime: the payment gateways, ANTHROPIC_API_KEY, and GOOGLE_MAPS_SERVER_KEY.
      # See backend/functions/.env.example for the full list and what each does.
      #
      # All of it is optional — every consumer degrades rather than breaks. No
      # gateway keys → wallet runs on the mock provider. No Maps key → en-route
      # pickups fall back to the (validated) client polyline.
      - name: Inject backend secrets
        working-directory: backend/functions
        env:
          PAYMENTS_GATEWAY_ENV: ${{ secrets.PAYMENTS_GATEWAY_ENV }}
        run: |
          if [ -n "$PAYMENTS_GATEWAY_ENV" ]; then
            printf '%s\n' "$PAYMENTS_GATEWAY_ENV" > .env.velocity-fe379
            echo "Backend secrets injected ($(grep -c '=' .env.velocity-fe379) vars)."
            # Say which optional integrations came out live, without printing values.
            grep -q '^GOOGLE_MAPS_SERVER_KEY=.\+' .env.velocity-fe379 \
              && echo "  · Routes API: server-side routing ENABLED" \
              || echo "  · Routes API: no key — en-route falls back to the client polyline"
          else
            echo "PAYMENTS_GATEWAY_ENV secret not set — payments stay in mock mode,"
            echo "and en-route pickups fall back to the client polyline."
          fi

      - name: Deploy Firestore indexes
        continue-on-error: true
        run: firebase deploy --only firestore:indexes --project velocity-fe379 --non-interactive

      - name: Deploy Cloud Functions + Firestore rules + Storage rules
        run: firebase deploy --only functions,firestore:rules,storage --project velocity-fe379 --non-interactive
